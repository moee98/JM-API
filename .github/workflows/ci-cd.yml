name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # JMAPI.sln (app + tests) — not the stale JM-API.sln, which omits the test project
      - run: dotnet restore JMAPI.sln
      - run: dotnet build JMAPI.sln --no-restore -c Release
      - run: dotnet test JMAPI.sln --no-build -c Release

# Publishing to GHCR happens in release-please.yml when a release PR is merged.
